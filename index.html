<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天助手</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ========== 主容器 ========== */
        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            margin: 12px;
        }

        /* ========== 顶栏 ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #0f3460;
            border-bottom: 1px solid #1a4a7a;
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a2e;
            padding: 4px 12px 4px 16px;
            border-radius: 20px;
            border: 1px solid #2a3a5a;
        }

        .model-selector label {
            font-size: 12px;
            color: #8899bb;
        }

        .model-selector select {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 6px 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 120px;
        }

        .model-selector select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #1a4a7a;
            border: none;
            color: #e0e0e0;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #2a5a8a;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-danger {
            background: #6b2a3a;
        }
        .btn-danger:hover {
            background: #8a3a4a;
        }

        .btn-success {
            background: #2a6a4a;
        }
        .btn-success:hover {
            background: #3a7a5a;
        }

        .btn-warning {
            background: #7a6a2a;
        }
        .btn-warning:hover {
            background: #9a8a3a;
        }

        .status {
            font-size: 12px;
            color: #6a8aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a6a4a;
            transition: background 0.3s;
        }

        .status .dot.active {
            background: #4ae04a;
            box-shadow: 0 0 8px #4ae04a66;
        }

        .status .dot.error {
            background: #e04a4a;
            box-shadow: 0 0 8px #e04a4a66;
        }

        /* ========== 消息区域 ========== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0d1b2a;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #0d1b2a;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #2a4a6a;
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a5a7a;
        }

        /* ========== 消息气泡 ========== */
        .msg {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .msg .time {
            font-size: 10px;
            color: #6a7a8a;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .msg.user {
            align-self: flex-end;
            background: #1a4a7a;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: #1a2a3a;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #3a7a9a;
        }

        .msg.system {
            align-self: center;
            background: #2a2a3a;
            color: #8a9aaa;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            max-width: 95%;
            text-align: center;
        }

        .msg.error {
            align-self: center;
            background: #3a1a1a;
            color: #e06a6a;
            border: 1px solid #5a2a2a;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            max-width: 95%;
        }

        .msg .tool-call {
            background: #1a2a2a;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #8ac4c4;
            border: 1px solid #2a4a4a;
            overflow-x: auto;
        }

        /* ========== 修改 / 修订 ========== */
        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            background: #2a3a5a;
            border: none;
            color: #cfe0f5;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-small:hover {
            background: #3a4a6a;
        }

        .msg-edit {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-edit .edit-input {
            background: #1a1a2e;
            border: 1px solid #3a5a7a;
            color: #e0e0e0;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 48px;
            outline: none;
        }

        .msg-edit .edit-input:focus {
            border-color: #4a8aaa;
        }

        .msg-edit .edit-btns {
            display: flex;
            gap: 6px;
        }

        .msg-edit .btn-submit {
            background: #1a4a7a;
        }
        .msg-edit .btn-submit:hover {
            background: #2a5a8a;
        }
        .msg-edit .btn-cancel {
            background: #6b2a3a;
        }
        .msg-edit .btn-cancel:hover {
            background: #8a3a4a;
        }

        /* 正在修改中的视觉提示 */
        .msg.modifying {
            box-shadow: 0 0 0 2px #e9456066;
            border-left-color: #e94560 !important;
        }

        .msg .edit-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 12px;
            color: #e9a3b0;
        }

        .msg .edit-status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e94560;
            animation: blink 0.8s infinite;
        }

        .msg-edit textarea:disabled,
        .msg-edit button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .msg .streaming {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: #4ae04a;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%,
            50% {
                opacity: 1;
            }
            51%,
            100% {
                opacity: 0;
            }
        }

        /* ========== 输入区域 ========== */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px 16px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a3a5a;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #4a8aaa;
        }

        .input-wrapper textarea {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
            width: 100%;
        }

        .input-wrapper textarea::placeholder {
            color: #5a6a7a;
        }

        .input-wrapper .char-count {
            text-align: right;
            font-size: 11px;
            color: #4a5a6a;
            padding: 2px 12px 6px;
        }

        .send-btn {
            background: linear-gradient(135deg, #e94560, #c73a54);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            height: 44px;
            min-width: 80px;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn .icon {
            display: inline-block;
            transition: transform 0.3s;
        }

        .send-btn:not(:disabled):hover .icon {
            transform: translateX(2px);
        }

        /* ========== 快捷键提示 ========== */
        .key-hint {
            font-size: 11px;
            color: #4a5a6a;
            padding: 0 4px;
        }

        .key-hint kbd {
            background: #1a1a2e;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            border: 1px solid #2a3a4a;
            color: #8a9aaa;
        }

        /* ========== 知识库面板 ========== */
        .kb-panel {
            display: none;
            flex-direction: column;
            background: #0f3460;
            border-bottom: 1px solid #1a4a7a;
            padding: 12px 20px;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .kb-panel.open {
            display: flex;
        }

        .kb-panel h4 {
            font-size: 13px;
            color: #8a9aaa;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kb-input-row {
            display: flex;
            gap: 8px;
        }

        .kb-input-row input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a3a5a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .kb-input-row input:focus {
            border-color: #4a8aaa;
        }

        .kb-fetch-btn {
            background: #1a4a7a;
            border: none;
            color: #e0e0e0;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .kb-fetch-btn:hover:not(:disabled) {
            background: #2a5a8a;
        }

        .kb-fetch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .kb-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kb-item {
            background: #16213e;
            border: 1px solid #2a3a5a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .kb-item .kb-item-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .kb-item .kb-title {
            color: #cfe0f5;
            font-weight: 600;
            word-break: break-word;
        }

        .kb-item .kb-url {
            color: #6a8aaa;
            font-size: 11px;
            margin-top: 2px;
            word-break: break-all;
        }

        .kb-item .kb-summary {
            color: #b0c0d0;
            margin-top: 6px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .kb-item .kb-del {
            background: #6b2a3a;
            border: none;
            color: #e0e0e0;
            padding: 3px 9px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .kb-status {
            color: #6a8aaa;
            font-size: 11px;
            font-weight: normal;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5a6a7a;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #8a9aaa;
            font-weight: 400;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .app {
                max-height: none;
                height: 100vh;
                border-radius: 0;
                margin: 0;
            }

            .header {
                padding: 12px 14px;
            }

            .logo {
                font-size: 18px;
            }

            .model-selector select {
                min-width: 80px;
                font-size: 12px;
            }

            .btn {
                font-size: 12px;
                padding: 4px 10px;
            }

            .messages {
                padding: 12px 14px;
            }

            .msg {
                max-width: 92%;
                font-size: 13px;
                padding: 8px 12px;
            }

            .input-area {
                padding: 10px 14px 12px;
                gap: 8px;
            }

            .send-btn {
                padding: 8px 16px;
                min-width: 60px;
                font-size: 13px;
                height: 40px;
            }

            .header-actions .btn span {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .model-selector {
                padding: 2px 8px 2px 12px;
            }
            .model-selector select {
                min-width: 60px;
                font-size: 11px;
            }
            .header-actions .btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ====== 顶栏 ====== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🤖 Chat</span>
                <div class="model-selector">
                    <label>模型</label>
                    <select id="modelSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <span class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">就绪</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" id="btnKb" title="打开知识库面板">📚 <span>知识库</span></button>
                <button class="btn btn-warning" id="btnModels" title="刷新模型列表">📋 <span>模型</span></button>
                <button class="btn btn-danger" id="btnReset">🔄 <span>重置</span></button>
                <button class="btn btn-success" id="btnClear">🗑️ <span>清屏</span></button>
            </div>
        </header>

        <!-- ====== 知识库面板 ====== -->
        <div class="kb-panel" id="kbPanel">
            <h4>📚 网页知识库 <span class="kb-status" id="kbStatus"></span></h4>
            <div class="kb-input-row">
                <input type="text" id="kbUrlInput" placeholder="输入任意网址，例如 https://example.com，回车抓取" />
                <button class="kb-fetch-btn" id="kbFetchBtn">抓取</button>
            </div>
            <div class="kb-list" id="kbList"></div>
        </div>

        <!-- ====== 消息区域 ====== -->
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="icon">💬</div>
                <h3>开始对话吧</h3>
                <p style="color:#4a5a6a;font-size:13px;margin-top:4px;">支持多轮对话，自动记忆上下文</p>
            </div>
        </div>

        <!-- ====== 输入区域 ====== -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="inputBox" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" maxlength="4000"></textarea>
                <div class="char-count"><span id="charCount">0</span> / 4000</div>
            </div>
            <button class="send-btn" id="sendBtn">
                <span class="icon">➤</span> 发送
            </button>
        </div>
    </div>

    <!-- ====== 配置 ====== -->
    <script>
        const CHAT_URL = '/api/chat'
        const MODELS_URL = '/api/models'
        const CONFIG = {
            maxHistory: 50,
            systemPrompt: 'You are a helpful assistant. 当用户的问题涉及已抓取保存的网页内容时，请使用 search_knowledge 工具在知识库中检索。调用该工具前，请先从用户问题中提炼出最能代表主题的关键词（如型号、产品名、专有名词，多个关键词用空格分隔），不要把整句自然语言问句直接作为检索词。例如查询「191步枪和171冲锋枪分别多重」时应传入「191 171」或「191步枪 171冲锋枪」。如果需要了解一个尚未保存的网页，请使用 fetch_webpage 工具抓取它。回答时请基于知识库返回的真实内容，并注明信息来源网址。',
        };

        const CHAT_TOOLS = [
            {
                type: 'function',
                function: {
                    name: 'search_knowledge',
                    description: '在用户已抓取保存的网页知识库中检索相关信息。调用时请先提炼最能代表主题的关键词（如型号、产品名、专有名词），多个关键词用空格分隔；不要把整句自然语言问句直接作为检索词。例如查询「191步枪和171冲锋枪分别多重」时应传入「191 171」或「191步枪 171冲锋枪」。',
                    parameters: {
                        type: 'object',
                        properties: {
                            query: { type: 'string', description: '提炼后的检索关键词，多个用空格分隔，例如 "191 171" 或 "QCQ-171 191步枪"' }
                        },
                        required: ['query']
                    }
                }
            },
            {
                type: 'function',
                function: {
                    name: 'fetch_webpage',
                    description: '抓取并总结任意网址的网页内容，同时保存到知识库。当用户需要了解某个尚未保存的网页、文章时使用。',
                    parameters: {
                        type: 'object',
                        properties: {
                            url: { type: 'string', description: '要抓取的完整网址，例如 https://example.com' }
                        },
                        required: ['url']
                    }
                }
            }
        ];

        class Chat {
            constructor(opts) {
                this.url = opts.url;
                this.modelsUrl = opts.modelsUrl;
                this.model = opts.model;
                this.maxHistory = opts.maxHistory ?? 200;
                this.extraHeaders = opts.headers || {};
                this.messages = [];
                this.tools = opts.tools;
                if (opts.system) this.messages.push({ role: 'system', content: opts.system });
            }
            reset() { this.messages = this.messages.filter(m => m.role === 'system'); }
            async models(name) {
                const url = this.modelsUrl + '?capabilities=TG&page_size=99&name=' + encodeURIComponent(name || '');
                const resp = await fetch(url, { headers: { 'Content-Type': 'application/json', ...this.extraHeaders } });
                return resp.json();
            }
            async *request(signal) {
                const systemMsgs = this.messages.filter(m => m.role === 'system');
                const turnMsgs = this.messages.filter(m => m.role !== 'system');
                const trimmed = turnMsgs.slice(-this.maxHistory * 2);
                const reqMessages = [...systemMsgs, ...trimmed];
                const resp = await fetch(this.url, {
                    method: 'POST', signal,
                    headers: { 'Content-Type': 'application/json', ...this.extraHeaders },
                    body: JSON.stringify({ tools: this.tools || [], model: this.model, messages: reqMessages, stream: true })
                });
                if (!resp.ok || !resp.body) {
                    const text = await resp.text().catch(() => '');
                    let error;
                    try { if (JSON.parse(text)?.error?.code === 'insufficient_quota') error = 'insufficient_quota'; } catch {}
                    if (error) throw error;
                    throw new Error(`请求失败 ${resp.status}: ${text}`);
                }
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let content = '';
                let toolCalls = {};
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let nl;
                    while ((nl = buffer.indexOf('\n')) >= 0) {
                        const line = buffer.slice(0, nl).trim();
                        buffer = buffer.slice(nl + 1);
                        if (!line.startsWith('data:')) continue;
                        const data = line.slice(5).trim();
                        if (!data || data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json?.choices?.[0]?.delta || {};
                            if (delta.content) { content += delta.content; yield ['t', delta.content]; }
                            for (const tc of delta.tool_calls || []) {
                                const idx = tc.index ?? 0;
                                if (!toolCalls[idx]) toolCalls[idx] = { id: '', name: '', arguments: '' };
                                if (tc.id) toolCalls[idx].id = tc.id;
                                if (tc.function?.name) toolCalls[idx].name += tc.function.name;
                                if (tc.function?.arguments) toolCalls[idx].arguments += tc.function.arguments;
                            }
                            if (json?.choices?.[0]?.finish_reason === 'tool_calls') {
                                const calls = Object.values(toolCalls).map(tc => ({ id: tc.id, name: tc.name, arguments: JSON.parse(tc.arguments || '{}') }));
                                if (calls.length) yield ['o', JSON.stringify(calls[0])];
                                if (calls.length) this.messages.push({ role: 'assistant', content: content || null, tool_calls: calls.map(tc => ({ id: tc.id, type: 'function', function: { name: tc.name, arguments: JSON.stringify(tc.arguments) } })) });
                            }
                        } catch (e) { console.debug('解析流式响应失败:', e.message); }
                    }
                }
                if (content) {
                    const last = this.messages[this.messages.length - 1];
                    if (!last || last.role !== 'assistant') this.messages.push({ role: 'assistant', content });
                    else if (!last.tool_calls) last.content = content;
                }
            }
        }

        const dom = {
            messages: document.getElementById('messages'), input: document.getElementById('inputBox'), sendBtn: document.getElementById('sendBtn'),
            modelSelect: document.getElementById('modelSelect'), statusDot: document.getElementById('statusDot'), statusText: document.getElementById('statusText'),
            charCount: document.getElementById('charCount'), btnModels: document.getElementById('btnModels'), btnReset: document.getElementById('btnReset'),
            btnClear: document.getElementById('btnClear'), btnKb: document.getElementById('btnKb'), kbPanel: document.getElementById('kbPanel'),
            kbUrlInput: document.getElementById('kbUrlInput'), kbFetchBtn: document.getElementById('kbFetchBtn'), kbList: document.getElementById('kbList'), kbStatus: document.getElementById('kbStatus'),
        };
        let chat = null;
        let currentModel = 'gpt-3.5-turbo';
        let isProcessing = false;
        let abortController = null;
        let streamingMessage = null;

        function setStatus(text, type = 'idle') { dom.statusText.textContent = text; dom.statusDot.className = 'dot'; if (type === 'active') dom.statusDot.classList.add('active'); if (type === 'error') dom.statusDot.classList.add('error'); }
        function addMessage(role, content, extra = {}) {
            const empty = dom.messages.querySelector('.empty-state'); if (empty) empty.remove();
            const msg = document.createElement('div'); msg.className = `msg ${role}`;
            if (role === 'system' || role === 'error') msg.textContent = content;
            else { const textDiv = document.createElement('div'); textDiv.textContent = content; msg.appendChild(textDiv); const time = document.createElement('span'); time.className = 'time'; time.textContent = new Date().toLocaleTimeString(); msg.appendChild(time); if (extra.toolCall) { const tc = document.createElement('div'); tc.className = 'tool-call'; tc.textContent = '🔧 ' + extra.toolCall; msg.appendChild(tc); } }
            dom.messages.appendChild(msg); dom.messages.scrollTop = dom.messages.scrollHeight; return msg;
        }
        function updateStreamingMessage(content) { if (!streamingMessage) { streamingMessage = addMessage('assistant', content); return streamingMessage; } const textDiv = streamingMessage.querySelector('div:first-child'); if (textDiv) textDiv.textContent = content; else streamingMessage.textContent = content; dom.messages.scrollTop = dom.messages.scrollHeight; return streamingMessage; }
        function finishStreaming() { streamingMessage = null; }
        function clearMessages() { dom.messages.innerHTML = '<div class="empty-state"><div class="icon">💬</div><h3>开始对话吧</h3><p style="color:#4a5a6a;font-size:13px;margin-top:4px;">支持多轮对话，自动记忆上下文</p></div>'; }
        function attachModify(msgEl, msgObj) { if (!msgEl || !msgObj) return; if (msgEl.querySelector('.msg-actions')) return; const actions = document.createElement('div'); actions.className = 'msg-actions'; const btn = document.createElement('button'); btn.className = 'btn-small'; btn.textContent = '✏️ 修改'; actions.appendChild(btn); msgEl.appendChild(actions); btn.onclick = () => showEdit(msgEl, msgObj, actions); }
        function updateMessageText(msgEl, content) { const textDiv = msgEl.querySelector('div:first-child'); if (textDiv) textDiv.textContent = content; }
        function showEdit(msgEl, msgObj, actions) { if (msgEl._editBox) return; const box = document.createElement('div'); box.className = 'msg-edit'; box.innerHTML = '<textarea class="edit-input" placeholder="请输入修改意见"></textarea><div class="edit-btns"><button class="btn-submit">提交</button><button class="btn-cancel">取消</button></div>'; msgEl.appendChild(box); msgEl._editBox = box; box.querySelector('.btn-submit').onclick = () => { const instr = box.querySelector('textarea').value.trim(); if (instr) doRevision(msgEl, msgObj, instr); }; box.querySelector('.btn-cancel').onclick = () => { box.remove(); msgEl._editBox = null; }; }
        async function doRevision(msgEl, msgObj, instruction) {
            if (isProcessing) return; isProcessing = true; setStatus('修改中...', 'active'); abortController = new AbortController(); msgEl.classList.add('modifying');
            let newContent = '';
            try {
                const resp = await fetch('/api/revise', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: [...chat.messages.slice(0, chat.messages.indexOf(msgObj)), { role: 'assistant', content: msgObj.content }, { role: 'user', content: '请根据以下修改意见，重新撰写你上一条（assistant 角色）的回复。只输出修改后的回复正文，不要重复用户的问题，也不要添加额外解释。\n\n修改意见：' + instruction }], model: currentModel, tools: CHAT_TOOLS }) });
                if (!resp.ok || !resp.body) throw new Error('修订请求失败 ' + resp.status);
                const reader = resp.body.getReader(); const decoder = new TextDecoder(); let buf = '';
                while (true) { const { value, done } = await reader.read(); if (done) break; buf += decoder.decode(value, { stream: true }); let nl; while ((nl = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1); if (!line.startsWith('data:')) continue; const data = line.slice(5).trim(); if (!data || data === '[DONE]') continue; try { const json = JSON.parse(data); const c = json?.choices?.[0]?.delta?.content; if (c) { newContent += c; updateMessageText(msgEl, newContent); } } catch {} } }
                msgObj.content = newContent; const editBox = msgEl._editBox; if (editBox) { editBox.remove(); msgEl._editBox = null; } msgEl.classList.remove('modifying'); setStatus('就绪', 'idle');
            } catch (e) { msgEl.classList.remove('modifying'); setStatus('就绪', 'idle'); addMessage('error', '❌ ' + e.message); }
            finally { isProcessing = false; }
        }
        async function loadKB() { try { const data = await (await fetch('/api/kb')).json(); dom.kbStatus.textContent = `${data.count} 条`; dom.kbList.innerHTML = data.items.map(item => `<div class="kb-item"><div class="kb-item-head"><div><div class="kb-title">${item.title || item.url}</div><div class="kb-url">${item.url}</div></div><button class="kb-del" data-id="${item.id}">删除</button></div><div class="kb-summary">${item.summary || ''}</div></div>`).join(''); dom.kbList.querySelectorAll('.kb-del').forEach(btn => btn.onclick = async () => { await fetch('/api/kb/' + encodeURIComponent(btn.dataset.id), { method: 'DELETE' }); loadKB(); }); } catch (e) { console.error('加载知识库失败:', e); } }
        async function fetchKB() { const url = dom.kbUrlInput.value.trim(); if (!url) return; dom.kbFetchBtn.disabled = true; dom.kbStatus.textContent = '抓取中...'; try { const resp = await fetch('/api/fetch-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }); const data = await resp.json(); if (!resp.ok) throw new Error(data.error || resp.status); dom.kbUrlInput.value = ''; await loadKB(); dom.kbStatus.textContent = '已加入'; } catch (e) { dom.kbStatus.textContent = '失败: ' + e.message; } finally { dom.kbFetchBtn.disabled = false; } }
        async function loadModels() { try { const data = await (await fetch(MODELS_URL)).json(); const models = data.data || []; dom.modelSelect.innerHTML = models.map(m => `<option value="${m.id}">${m.id}</option>`).join(''); if (models.length) { currentModel = models[0].id; switchModel(currentModel); } } catch (e) { console.error('加载模型失败:', e); } }
        function switchModel(model) { if (!model) return; currentModel = model; chat = new Chat({ url: CHAT_URL, modelsUrl: MODELS_URL, model: currentModel, maxHistory: CONFIG.maxHistory, system: CONFIG.systemPrompt, tools: CHAT_TOOLS }); dom.modelSelect.value = model; setStatus(`模型: ${model}`, 'idle'); }
        async function executeTool(call) {
            try {
                if (call.name === 'search_knowledge') { const q = call.arguments?.query || ''; const resp = await fetch('/api/kb-search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: q }) }); const data = await resp.json(); return data.results?.length ? JSON.stringify(data.results, null, 2) : '知识库中未找到与「' + q + '」相关的内容。'; }
                if (call.name === 'fetch_webpage') { const url = call.arguments?.url || ''; const resp = await fetch('/api/fetch-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }); const data = await resp.json(); if (!resp.ok) return '抓取网页失败: ' + (data.error || resp.status); loadKB(); return '已抓取并保存到知识库。\n标题: ' + data.title + '\n网址: ' + data.url + '\n内容长度: ' + data.length + ' 字符\n\n摘要:\n' + data.summary; }
                return '未知工具: ' + call.name;
            } catch (e) { return '工具执行出错: ' + e.message; }
        }
        async function sendMessage() {
            const text = dom.input.value.trim(); if (!text || isProcessing) return;
            if (!chat) chat = new Chat({ url: CHAT_URL, modelsUrl: MODELS_URL, model: currentModel, maxHistory: CONFIG.maxHistory, system: CONFIG.systemPrompt, tools: CHAT_TOOLS });
            addMessage('user', text); dom.input.value = ''; dom.charCount.textContent = '0'; dom.input.style.height = 'auto'; isProcessing = true; dom.sendBtn.disabled = true; dom.sendBtn.innerHTML = '<span class="icon">⏳</span> 发送中...'; setStatus('思考中...', 'active'); abortController = new AbortController(); let fullContent = ''; let hasContent = false; let toolRound = 0;
            try {
                chat.messages.push({ role: 'user', content: text });
                while (true) {
                    let toolCalls = [];
                    for await (const chunk of chat.request(abortController.signal)) { if (chunk[0] === 't') { hasContent = true; fullContent += chunk[1]; updateStreamingMessage(fullContent); } else if (chunk[0] === 'o') { try { const call = JSON.parse(chunk[1]); toolCalls.push(call); addMessage('system', `🔧 调用工具: ${call.name}`); } catch {} } }
                    if (!toolCalls.length) { const lastMsg = chat.messages[chat.messages.length - 1]; if (lastMsg?.role === 'assistant' && streamingMessage) attachModify(streamingMessage, lastMsg); break; }
                    toolRound++; setStatus(`执行工具 (第 ${toolRound} 轮)...`, 'active'); const reports = []; for (const call of toolCalls) { const result = await executeTool(call); addMessage('system', `📨 工具结果: ${call.name}`, { toolCall: result.slice(0, 2000) }); reports.push({ id: call.id, content: result }); } reports.forEach(r => chat.messages.push({ role: 'tool', tool_call_id: r.id, content: r.content })); finishStreaming(); fullContent = ''; hasContent = false;
                }
                if (!hasContent) addMessage('system', '没有收到回复内容'); finishStreaming(); setStatus('就绪', 'idle');
            } catch (err) { if (err.name === 'AbortError') addMessage('system', '⏹️ 已取消请求'); else if (err === 'insufficient_quota') addMessage('error', '❌ 配额不足，请检查账户余额'); else { console.error('请求错误:', err); addMessage('error', '❌ ' + (err.message || err)); } finishStreaming(); setStatus('错误', 'error'); }
            finally { isProcessing = false; dom.sendBtn.disabled = false; dom.sendBtn.innerHTML = '<span class="icon">➤</span> 发送'; }
        }
        dom.sendBtn.onclick = sendMessage; dom.input.addEventListener('input', () => { dom.charCount.textContent = dom.input.value.length; dom.input.style.height = 'auto'; dom.input.style.height = Math.min(dom.input.scrollHeight, 120) + 'px'; }); dom.input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }); dom.btnClear.onclick = () => { clearMessages(); if (chat) chat.reset(); }; dom.btnReset.onclick = () => { if (confirm('确定要重置当前对话吗？')) { clearMessages(); if (chat) chat.reset(); } }; dom.btnModels.onclick = loadModels; dom.btnKb.onclick = () => { dom.kbPanel.classList.toggle('open'); if (dom.kbPanel.classList.contains('open')) loadKB(); }; dom.kbFetchBtn.onclick = fetchKB; dom.kbUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchKB(); }); loadModels(); loadKB();
    </script>
    <script src="tools-ui.js"></script>
    <script src="workdir-ui.js"></script>
</body>
