<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天助手</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ========== 主容器 ========== */
        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: #16213e;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            margin: 12px;
        }

        /* ========== 顶栏 ========== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #0f3460;
            border-bottom: 1px solid #1a4a7a;
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a2e;
            padding: 4px 12px 4px 16px;
            border-radius: 20px;
            border: 1px solid #2a3a5a;
        }

        .model-selector label {
            font-size: 12px;
            color: #8899bb;
        }

        .model-selector select {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 6px 4px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 120px;
        }

        .model-selector select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #1a4a7a;
            border: none;
            color: #e0e0e0;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #2a5a8a;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-danger {
            background: #6b2a3a;
        }
        .btn-danger:hover {
            background: #8a3a4a;
        }

        .btn-success {
            background: #2a6a4a;
        }
        .btn-success:hover {
            background: #3a7a5a;
        }

        .btn-warning {
            background: #7a6a2a;
        }
        .btn-warning:hover {
            background: #9a8a3a;
        }

        .status {
            font-size: 12px;
            color: #6a8aaa;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a6a4a;
            transition: background 0.3s;
        }

        .status .dot.active {
            background: #4ae04a;
            box-shadow: 0 0 8px #4ae04a66;
        }

        .status .dot.error {
            background: #e04a4a;
            box-shadow: 0 0 8px #e04a4a66;
        }

        /* ========== 消息区域 ========== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0d1b2a;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #0d1b2a;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #2a4a6a;
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a5a7a;
        }

        /* ========== 消息气泡 ========== */
        .msg {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .msg .time {
            font-size: 10px;
            color: #6a7a8a;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .msg.user {
            align-self: flex-end;
            background: #1a4a7a;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: #1a2a3a;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #3a7a9a;
        }

        .msg.system {
            align-self: center;
            background: #2a2a3a;
            color: #8a9aaa;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            max-width: 95%;
            text-align: center;
        }

        .msg.error {
            align-self: center;
            background: #3a1a1a;
            color: #e06a6a;
            border: 1px solid #5a2a2a;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            max-width: 95%;
        }

        .msg .tool-call {
            background: #1a2a2a;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #8ac4c4;
            border: 1px solid #2a4a4a;
            overflow-x: auto;
        }

        /* ========== 修改 / 修订 ========== */
        .msg-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            background: #2a3a5a;
            border: none;
            color: #cfe0f5;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-small:hover {
            background: #3a4a6a;
        }

        .msg-edit {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-edit .edit-input {
            background: #1a1a2e;
            border: 1px solid #3a5a7a;
            color: #e0e0e0;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 48px;
            outline: none;
        }

        .msg-edit .edit-input:focus {
            border-color: #4a8aaa;
        }

        .msg-edit .edit-btns {
            display: flex;
            gap: 6px;
        }

        .msg-edit .btn-submit {
            background: #1a4a7a;
        }
        .msg-edit .btn-submit:hover {
            background: #2a5a8a;
        }
        .msg-edit .btn-cancel {
            background: #6b2a3a;
        }
        .msg-edit .btn-cancel:hover {
            background: #8a3a4a;
        }

        .msg .streaming {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: #4ae04a;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            0%,
            50% {
                opacity: 1;
            }
            51%,
            100% {
                opacity: 0;
            }
        }

        /* ========== 输入区域 ========== */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px 16px;
            background: #0f3460;
            border-top: 1px solid #1a4a7a;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a3a5a;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #4a8aaa;
        }

        .input-wrapper textarea {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
            width: 100%;
        }

        .input-wrapper textarea::placeholder {
            color: #5a6a7a;
        }

        .input-wrapper .char-count {
            text-align: right;
            font-size: 11px;
            color: #4a5a6a;
            padding: 2px 12px 6px;
        }

        .send-btn {
            background: linear-gradient(135deg, #e94560, #c73a54);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            height: 44px;
            min-width: 80px;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn .icon {
            display: inline-block;
            transition: transform 0.3s;
        }

        .send-btn:not(:disabled):hover .icon {
            transform: translateX(2px);
        }

        /* ========== 快捷键提示 ========== */
        .key-hint {
            font-size: 11px;
            color: #4a5a6a;
            padding: 0 4px;
        }

        .key-hint kbd {
            background: #1a1a2e;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            border: 1px solid #2a3a4a;
            color: #8a9aaa;
        }

        /* ========== 知识库面板 ========== */
        .kb-panel {
            display: none;
            flex-direction: column;
            background: #0f3460;
            border-bottom: 1px solid #1a4a7a;
            padding: 12px 20px;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
        }

        .kb-panel.open {
            display: flex;
        }

        .kb-panel h4 {
            font-size: 13px;
            color: #8a9aaa;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kb-input-row {
            display: flex;
            gap: 8px;
        }

        .kb-input-row input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2a3a5a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .kb-input-row input:focus {
            border-color: #4a8aaa;
        }

        .kb-fetch-btn {
            background: #1a4a7a;
            border: none;
            color: #e0e0e0;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .kb-fetch-btn:hover:not(:disabled) {
            background: #2a5a8a;
        }

        .kb-fetch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .kb-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kb-item {
            background: #16213e;
            border: 1px solid #2a3a5a;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .kb-item .kb-item-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .kb-item .kb-title {
            color: #cfe0f5;
            font-weight: 600;
            word-break: break-word;
        }

        .kb-item .kb-url {
            color: #6a8aaa;
            font-size: 11px;
            margin-top: 2px;
            word-break: break-all;
        }

        .kb-item .kb-summary {
            color: #b0c0d0;
            margin-top: 6px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .kb-item .kb-del {
            background: #6b2a3a;
            border: none;
            color: #e0e0e0;
            padding: 3px 9px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .kb-item .kb-del:hover {
            background: #8a3a4a;
        }

        .kb-status {
            font-size: 12px;
            color: #6a8aaa;
        }

        .kb-empty {
            font-size: 12px;
            color: #5a6a7a;
            text-align: center;
            padding: 8px;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4a5a6a;
            user-select: none;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #8a9aaa;
            font-weight: 400;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .app {
                max-height: none;
                height: 100vh;
                border-radius: 0;
                margin: 0;
            }

            .header {
                padding: 12px 14px;
            }

            .logo {
                font-size: 18px;
            }

            .model-selector select {
                min-width: 80px;
                font-size: 12px;
            }

            .btn {
                font-size: 12px;
                padding: 4px 10px;
            }

            .messages {
                padding: 12px 14px;
            }

            .msg {
                max-width: 92%;
                font-size: 13px;
                padding: 8px 12px;
            }

            .input-area {
                padding: 10px 14px 12px;
                gap: 8px;
            }

            .send-btn {
                padding: 8px 16px;
                min-width: 60px;
                font-size: 13px;
                height: 40px;
            }

            .header-actions .btn span {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .model-selector {
                padding: 2px 8px 2px 12px;
            }
            .model-selector select {
                min-width: 60px;
                font-size: 11px;
            }
            .header-actions .btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ====== 顶栏 ====== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🤖 Chat</span>
                <div class="model-selector">
                    <label>模型</label>
                    <select id="modelSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <span class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">就绪</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" id="btnKb" title="打开知识库面板">📚 <span>知识库</span></button>
                <button class="btn btn-warning" id="btnModels" title="刷新模型列表">📋 <span>模型</span></button>
                <button class="btn btn-danger" id="btnReset">🔄 <span>重置</span></button>
                <button class="btn btn-success" id="btnClear">🗑️ <span>清屏</span></button>
            </div>
        </header>

        <!-- ====== 知识库面板 ====== -->
        <div class="kb-panel" id="kbPanel">
            <h4>📚 网页知识库 <span class="kb-status" id="kbStatus"></span></h4>
            <div class="kb-input-row">
                <input type="text" id="kbUrlInput" placeholder="输入任意网址，例如 https://example.com，回车抓取" />
                <button class="kb-fetch-btn" id="kbFetchBtn">抓取</button>
            </div>
            <div class="kb-list" id="kbList"></div>
        </div>

        <!-- ====== 消息区域 ====== -->
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="icon">💬</div>
                <h3>开始对话吧</h3>
                <p style="color:#4a5a6a;font-size:13px;margin-top:4px;">支持多轮对话，自动记忆上下文</p>
            </div>
        </div>

        <!-- ====== 输入区域 ====== -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="inputBox" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" maxlength="4000"></textarea>
                <div class="char-count"><span id="charCount">0</span> / 4000</div>
            </div>
            <button class="send-btn" id="sendBtn">
                <span class="icon">➤</span> 发送
            </button>
        </div>
    </div>

    <!-- ====== 配置 ====== -->
    <script>
        // ============================================================
        //  配置 - 请在这里修改你的 API 信息
        // ============================================================
        const CHAT_URL = '/api/chat'
        const MODELS_URL = '/api/models'
        const CONFIG = {
            maxHistory: 50,
            systemPrompt: 'You are a helpful assistant. 当用户的问题涉及已抓取保存的网页内容时，请使用 search_knowledge 工具在知识库中检索。调用该工具前，请先从用户问题中提炼出最能代表主题的关键词（如型号、产品名、专有名词，多个关键词用空格分隔），不要把整句自然语言问句直接作为检索词。例如查询「191步枪和171冲锋枪分别多重」时应传入「191 171」或「191步枪 171冲锋枪」。如果需要了解一个尚未保存的网页，请使用 fetch_webpage 工具抓取它。回答时请基于知识库返回的真实内容，并注明信息来源网址。',
        };

        // 供模型调用的工具定义
        const CHAT_TOOLS = [
            {
                type: 'function',
                function: {
                    name: 'search_knowledge',
                    description: '在用户已抓取保存的网页知识库中检索相关信息。调用时请先提炼最能代表主题的关键词（如型号、产品名、专有名词），多个关键词用空格分隔；不要把整句自然语言问句直接作为检索词。例如查询「191步枪和171冲锋枪分别多重」时应传入「191 171」或「191步枪 171冲锋枪」。',
                    parameters: {
                        type: 'object',
                        properties: {
                            query: { type: 'string', description: '提炼后的检索关键词，多个用空格分隔，例如 "191 171" 或 "QCQ-171 191步枪"' }
                        },
                        required: ['query']
                    }
                }
            },
            {
                type: 'function',
                function: {
                    name: 'fetch_webpage',
                    description: '抓取并总结任意网址的网页内容，同时保存到知识库。当用户需要了解某个尚未保存的网页、文章时使用。',
                    parameters: {
                        type: 'object',
                        properties: {
                            url: { type: 'string', description: '要抓取的完整网址，例如 https://example.com' }
                        },
                        required: ['url']
                    }
                }
            }
        ];

        // ============================================================
        //  核心 Chat 类（从 chat.js 移植，适配浏览器）
        // ============================================================
        class Chat {
            constructor(opts) {
                this.url = opts.url;
                this.modelsUrl = opts.modelsUrl;
                this.model = opts.model;
                this.maxHistory = opts.maxHistory ?? 200;
                this.extraHeaders = opts.headers || {};
                this.messages = [];
                this.tools = opts.tools;

                if (opts.system) {
                    this.messages.push({ role: 'system', content: opts.system });
                }
            }

            reset() {
                this.messages = this.messages.filter(m => m.role === 'system');
            }

            async models(name) {
                const url = this.modelsUrl + '?capabilities=TG&page_size=99&name=' + encodeURIComponent(name || '');
                const resp = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...this.extraHeaders
                    }
                });
                return resp.json();
            }

            async *request(signal) {
                const systemMsgs = this.messages.filter(m => m.role === 'system');
                const turnMsgs = this.messages.filter(m => m.role !== 'system');
                const trimmed = turnMsgs.slice(-this.maxHistory * 2);
                const reqMessages = [...systemMsgs, ...trimmed];

                reqMessages.forEach(console.log)

                const resp = await fetch(this.url, {
                    method: 'POST',
                    signal,
                    headers: {
                        'Content-Type': 'application/json',
                        ...this.extraHeaders
                    },
                    body: JSON.stringify({
                        tools: this.tools || [],
                        model: this.model,
                        messages: reqMessages,
                        stream: true
                    })
                });

                if (!resp.ok || !resp.body) {
                    const text = await resp.text().catch(() => '');
                    let error;
                    try {
                        const json = JSON.parse(text);
                        if (json?.error?.code === 'insufficient_quota') {
                            error = 'insufficient_quota';
                        }
                    } catch {}
                    if (error) throw error;
                    throw new Error(`请求失败 ${resp.status}: ${text}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                let assistantText = '';
                const toolCallsAcc = {};

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });

                    let nl;
                    while ((nl = buf.indexOf('\n')) >= 0) {
                        const line = buf.slice(0, nl).trim();
                        buf = buf.slice(nl + 1);

                        if (!line.startsWith('data:')) continue;
                        const data = line.slice(5).trim();
                        if (data === '[DONE]') break;

                        try {
                            const json = JSON.parse(data);
                            const choice = json?.choices?.[0];
                            const delta = choice?.delta;

                            if (delta?.tool_calls) {
                                for (const tc of delta.tool_calls) {
                                    const idx = tc.index ?? 0;
                                    if (!toolCallsAcc[idx]) {
                                        toolCallsAcc[idx] = {
                                            id: '',
                                            type: 'function',
                                            function: { name: '', arguments: '' }
                                        };
                                    }
                                    if (tc.id) toolCallsAcc[idx].id = tc.id;
                                    if (tc.type) toolCallsAcc[idx].type = tc.type;
                                    if (tc.function?.name) {
                                        toolCallsAcc[idx].function.name += tc.function.name;
                                    }
                                    if (tc.function?.arguments) {
                                        toolCallsAcc[idx].function.arguments += tc.function.arguments;
                                    }
                                }
                            }

                            if (choice?.finish_reason === 'tool_calls') {
                                const calls = [];
                                for (const tc of Object.values(toolCallsAcc)) {
                                    const call = {
                                        id: tc.id,
                                        name: tc.function.name,
                                        arguments: JSON.parse(tc.function.arguments),
                                    };
                                    calls.push(call);
                                    yield 'o' + JSON.stringify(call);
                                }
                                this.messages.push({
                                    role: 'assistant',
                                    tool_calls: calls.map(x => ({
                                        id: x.id,
                                        type: 'function',
                                        function: { name: x.name, arguments: JSON.stringify(x.arguments) }
                                    }))
                                });
                                return;
                            }

                            const content = delta?.content;
                            if (content) {
                                assistantText += content;
                                yield 't' + content;
                            }
                        } catch (e) {
                            // 忽略不完整行
                        }
                    }
                }

                this.messages.push({ role: 'assistant', content: assistantText });
            }

            async *ask(prompt, signal) {
                this.messages.push({ role: 'user', content: prompt });
                for await (const chunk of this.request(signal)) {
                    yield chunk;
                }
            }

            async *reportCalls(calls, signal) {
                calls.forEach(c => {
                    this.messages.push({
                        role: 'tool',
                        tool_call_id: c.id,
                        content: c.content
                    });
                });
                for await (const chunk of this.request(signal)) {
                    yield chunk;
                }
            }
        }

        // ============================================================
        //  UI 控制
        // ============================================================
        const dom = {
            messages: document.getElementById('messages'),
            input: document.getElementById('inputBox'),
            sendBtn: document.getElementById('sendBtn'),
            modelSelect: document.getElementById('modelSelect'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            charCount: document.getElementById('charCount'),
            btnModels: document.getElementById('btnModels'),
            btnReset: document.getElementById('btnReset'),
            btnClear: document.getElementById('btnClear'),
            btnKb: document.getElementById('btnKb'),
            kbPanel: document.getElementById('kbPanel'),
            kbUrlInput: document.getElementById('kbUrlInput'),
            kbFetchBtn: document.getElementById('kbFetchBtn'),
            kbList: document.getElementById('kbList'),
            kbStatus: document.getElementById('kbStatus'),
        };

        let chat = null;
        let currentModel = CONFIG.defaultModel;
        let availableModels = [];
        let isProcessing = false;
        let abortController = null;
        let streamingMessage = null; // 当前正在流式输出的消息元素

        // ========== 状态管理 ==========
        function setStatus(text, type = 'idle') {
            dom.statusText.textContent = text;
            dom.statusDot.className = 'dot';
            if (type === 'active') dom.statusDot.classList.add('active');
            if (type === 'error') dom.statusDot.classList.add('error');
        }

        function addMessage(role, content, extra = {}) {
            // 移除空状态
            const empty = dom.messages.querySelector('.empty-state');
            if (empty) empty.remove();

            const msg = document.createElement('div');
            msg.className = `msg ${role}`;

            if (role === 'system' || role === 'error') {
                msg.textContent = content;
            } else {
                // 处理内容中的换行
                const textDiv = document.createElement('div');
                textDiv.textContent = content;
                msg.appendChild(textDiv);

                // 时间戳
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = new Date().toLocaleTimeString();
                msg.appendChild(time);

                // Tool call 信息
                if (extra.toolCall) {
                    const tc = document.createElement('div');
                    tc.className = 'tool-call';
                    tc.textContent = '🔧 ' + extra.toolCall;
                    msg.appendChild(tc);
                }
            }

            dom.messages.appendChild(msg);
            dom.messages.scrollTop = dom.messages.scrollHeight;
            return msg;
        }

        function updateStreamingMessage(content) {
            if (!streamingMessage) {
                streamingMessage = addMessage('assistant', content);
                return streamingMessage;
            }
            // 更新已有消息
            const textDiv = streamingMessage.querySelector('div:first-child');
            if (textDiv) {
                textDiv.textContent = content;
            } else {
                streamingMessage.textContent = content;
            }
            dom.messages.scrollTop = dom.messages.scrollHeight;
            return streamingMessage;
        }

        function finishStreaming() {
            streamingMessage = null;
        }

        function clearMessages() {
            dom.messages.innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <h3>开始对话吧</h3>
                    <p style="color:#4a5a6a;font-size:13px;margin-top:4px;">支持多轮对话，自动记忆上下文</p>
                </div>
            `;
            streamingMessage = null;
        }

        // ========== 修改 / 修订 ==========
        function mkBtn(label, onClick, extraClass = '') {
            const b = document.createElement('button');
            b.className = 'btn btn-small ' + extraClass;
            b.textContent = label;
            b.addEventListener('click', onClick);
            return b;
        }

        // 仅更新消息正文文本（保留时间、操作按钮等子元素）
        function updateMessageText(msgEl, text) {
            let div = msgEl.querySelector('div:first-child');
            if (!div) {
                div = document.createElement('div');
                msgEl.insertBefore(div, msgEl.firstChild);
            }
            div.textContent = text;
            dom.messages.scrollTop = dom.messages.scrollHeight;
        }

        // 给一条 assistant 消息附加「修改」按钮
        function attachModify(msgEl, msgObj) {
            if (msgEl._modifyAttached) return;
            msgEl._modifyAttached = true;
            msgEl._msgObj = msgObj;

            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.appendChild(mkBtn('✏️ 修改', () => startEdit(msgEl, msgObj, actions)));
            msgEl.appendChild(actions);
        }

        // 进入编辑态：展示意见输入框
        function startEdit(msgEl, msgObj, actions) {
            if (isProcessing) return;
            if (msgEl._origContent === undefined) msgEl._origContent = msgObj.content;

            actions.style.display = 'none';
            if (msgEl._editBox) msgEl._editBox.remove();

            const editBox = document.createElement('div');
            editBox.className = 'msg-edit';
            editBox.innerHTML = `
                <textarea class="edit-input" placeholder="输入修改意见，例如：把语气改得更正式一些 / 再补充两点 / 精简到三句话"></textarea>
                <div class="edit-btns">
                    <button class="btn btn-small btn-submit">提交修改</button>
                    <button class="btn btn-small btn-cancel">取消</button>
                </div>`;
            msgEl.appendChild(editBox);
            msgEl._editBox = editBox;

            const ta = editBox.querySelector('.edit-input');
            ta.focus();
            editBox.querySelector('.btn-submit').addEventListener('click', () => {
                const instr = ta.value.trim();
                if (!instr) return;
                doRevision(msgEl, msgObj, instr, actions);
            });
            editBox.querySelector('.btn-cancel').addEventListener('click', () => {
                cancelEdit(msgEl, msgObj, actions);
            });
        }

        // 调用修订接口，按意见重新生成该条回复
        async function doRevision(msgEl, msgObj, instruction) {
            if (isProcessing) return;
            isProcessing = true;
            setStatus('修改中...', 'active');
            abortController = new AbortController();

            const idx = chat.messages.indexOf(msgObj);
            const prefix = chat.messages.slice(0, idx);
            const reviseMessages = [
                ...prefix,
                { role: 'assistant', content: msgObj.content },
                {
                    role: 'user',
                    content:
                        '请根据以下修改意见，重新撰写你上一条（assistant 角色）的回复。' +
                        '只输出修改后的回复正文，不要重复用户的问题，也不要添加额外解释。\n\n' +
                        '修改意见：' + instruction,
                },
            ];

            let newContent = '';
            try {
                const resp = await fetch('/api/revise', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: reviseMessages,
                        model: currentModel,
                        tools: CHAT_TOOLS,
                    }),
                });
                if (!resp.ok || !resp.body) {
                    const t = await resp.text().catch(() => '');
                    throw new Error('修订请求失败 ' + resp.status + ' ' + t);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    let nl;
                    while ((nl = buf.indexOf('\n')) >= 0) {
                        const line = buf.slice(0, nl).trim();
                        buf = buf.slice(nl + 1);
                        if (!line.startsWith('data:')) continue;
                        const data = line.slice(5).trim();
                        if (data === '[DONE]') break;
                        try {
                            const json = JSON.parse(data);
                            const c = json?.choices?.[0]?.delta?.content;
                            if (c) {
                                newContent += c;
                                updateMessageText(msgEl, newContent);
                            }
                        } catch {}
                    }
                }

                // 实时把修订结果写回该消息对象（确定时即生效）
                msgObj.content = newContent;
                finishEditUI(msgEl);
            } catch (err) {
                addMessage('error', '❌ 修改失败: ' + (err.message || err));
            } finally {
                isProcessing = false;
                setStatus('就绪', 'idle');
                abortController = null;
            }
        }

        // 修订完成：替换为「继续修改 / 确定 / 取消」
        function finishEditUI(msgEl) {
            if (msgEl._editBox) {
                msgEl._editBox.remove();
                msgEl._editBox = null;
            }
            const actions = msgEl.querySelector('.msg-actions');
            actions.style.display = 'flex';
            actions.innerHTML = '';
            actions.appendChild(mkBtn('↻ 继续修改', () => startEdit(msgEl, msgEl._msgObj, actions)));
            actions.appendChild(mkBtn('✅ 确定', () => confirmEdit(msgEl)));
            actions.appendChild(mkBtn('✖ 取消', () => cancelEdit(msgEl, msgEl._msgObj, actions)));
        }

        // 取消：恢复原始内容，回到单一「修改」按钮
        function cancelEdit(msgEl, msgObj, actions) {
            if (msgEl._editBox) {
                msgEl._editBox.remove();
                msgEl._editBox = null;
            }
            msgObj.content = msgEl._origContent;
            updateMessageText(msgEl, msgObj.content);
            resetToModifyButton(msgEl, actions);
            addMessage('system', '↩️ 已取消修改，保留原始回复');
        }

        // 确定：把对话历史截断到该 assistant 消息之后（丢弃其后的旧内容），并落定修订
        function confirmEdit(msgEl) {
            const msgObj = msgEl._msgObj;
            const idx = chat.messages.indexOf(msgObj);
            if (idx >= 0) {
                chat.messages.length = idx + 1;
            }
            msgEl._origContent = msgObj.content;
            const actions = msgEl.querySelector('.msg-actions');
            resetToModifyButton(msgEl, actions);

            // 同步移除该消息之后、界面上仍显示的旧气泡
            let node = msgEl.nextElementSibling;
            while (node) {
                const next = node.nextElementSibling;
                node.remove();
                node = next;
            }
            addMessage('system', '✅ 已更新对话历史（该回复之后的旧内容已移除，可继续对话）');
        }

        function resetToModifyButton(msgEl, actions) {
            if (!actions) actions = msgEl.querySelector('.msg-actions');
            actions.style.display = 'flex';
            actions.innerHTML = '';
            actions.appendChild(mkBtn('✏️ 修改', () => startEdit(msgEl, msgEl._msgObj, actions)));
        }

        // ========== 模型管理 ==========
        async function loadModels() {
            try {
                setStatus('加载模型...', 'active');
                const temp = new Chat({
                    url: CHAT_URL,
                    modelsUrl: MODELS_URL,
                    model: currentModel,
                });
                const result = await temp.models('');
                availableModels = result.data || [];

                dom.modelSelect.innerHTML = '';
                if (availableModels.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '无可用模型';
                    dom.modelSelect.appendChild(opt);
                    return;
                }

                availableModels.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.id;
                    if (m.id === currentModel) opt.selected = true;
                    dom.modelSelect.appendChild(opt);
                });

                setStatus(`就绪 (${availableModels.length} 个模型)`, 'idle');
            } catch (err) {
                setStatus('加载模型失败', 'error');
                dom.modelSelect.innerHTML = `<option value="">加载失败</option>`;
                console.error('加载模型失败:', err);
            }
        }

        function switchModel(model) {
            if (!model) return;
            currentModel = model;
            chat = new Chat({
                url: CHAT_URL,
                modelsUrl: MODELS_URL,
                model: currentModel,
                maxHistory: CONFIG.maxHistory,
                system: CONFIG.systemPrompt,
                tools: CHAT_TOOLS,
            });
            // 同步下拉框
            dom.modelSelect.value = model;
            setStatus(`模型: ${model}`, 'idle');
        }

        // ========== 工具执行 ==========
        async function executeTool(call) {
            try {
                if (call.name === 'search_knowledge') {
                    const q = call.arguments?.query || '';
                    const resp = await fetch('/api/kb-search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: q }),
                    });
                    const data = await resp.json();
                    if (data.results && data.results.length) {
                        return JSON.stringify(data.results, null, 2);
                    }
                    return '知识库中未找到与「' + q + '」相关的内容。';
                } else if (call.name === 'fetch_webpage') {
                    const url = call.arguments?.url || '';
                    const resp = await fetch('/api/fetch-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url }),
                    });
                    const data = await resp.json();
                    if (!resp.ok) {
                        return '抓取网页失败: ' + (data.error || resp.status);
                    }
                    // 同步刷新知识库列表
                    loadKB();
                    return '已抓取并保存到知识库。\n标题: ' + data.title +
                        '\n网址: ' + data.url +
                        '\n内容长度: ' + data.length + ' 字符\n\n摘要:\n' + data.summary;
                }
                return '未知工具: ' + call.name;
            } catch (e) {
                return '工具执行出错: ' + e.message;
            }
        }

        // ========== 发送消息 ==========
        async function sendMessage() {
            const text = dom.input.value.trim();
            if (!text || isProcessing) return;

            // 初始化 chat（如果还没有）
            if (!chat) {
                chat = new Chat({
                    url: CHAT_URL,
                    modelsUrl: MODELS_URL,
                    model: currentModel,
                    maxHistory: CONFIG.maxHistory,
                    system: CONFIG.systemPrompt,
                    tools: CHAT_TOOLS,
                });
            }

            // 显示用户消息
            addMessage('user', text);

            // 清空输入
            dom.input.value = '';
            dom.charCount.textContent = '0';
            dom.input.style.height = 'auto';

            isProcessing = true;
            dom.sendBtn.disabled = true;
            dom.sendBtn.innerHTML = '<span class="icon">⏳</span> 发送中...';
            setStatus('思考中...', 'active');

            abortController = new AbortController();
            let fullContent = '';
            let hasContent = false;
            let toolRound = 0;

            try {
                // 把用户消息加入对话并发起第一轮请求
                chat.messages.push({ role: 'user', content: text });

                while (true) {
                    let toolCalls = [];

                    for await (const chunk of chat.request(abortController.signal)) {
                        const type = chunk[0];
                        const content = chunk.slice(1);

                        if (type === 't') {
                            hasContent = true;
                            fullContent += content;
                            updateStreamingMessage(fullContent);
                        } else if (type === 'o') {
                            // tool call
                            try {
                                const call = JSON.parse(content);
                                toolCalls.push(call);
                                addMessage('system', `🔧 调用工具: ${call.name}`, { toolCall: JSON.stringify(call.arguments, null, 2) });
                            } catch {
                                addMessage('system', `🔧 ${content}`);
                            }
                        }
                    }

                    // 没有工具调用 -> 本轮回复结束
                    if (toolCalls.length === 0) {
                        const lastMsg = chat.messages[chat.messages.length - 1];
                        if (lastMsg && lastMsg.role === 'assistant' && streamingMessage) {
                            attachModify(streamingMessage, lastMsg);
                        }
                        break;
                    }

                    // 执行工具并回填结果
                    toolRound++;
                    setStatus(`执行工具 (第 ${toolRound} 轮)...`, 'active');
                    const reports = [];
                    for (const call of toolCalls) {
                        const result = await executeTool(call);
                        addMessage('system', `📨 工具结果: ${call.name}`, { toolCall: result.slice(0, 2000) });
                        reports.push({ id: call.id, content: result });
                    }

                    // 将工具结果写入对话历史，准备下一轮请求
                    reports.forEach((r) => {
                        chat.messages.push({
                            role: 'tool',
                            tool_call_id: r.id,
                            content: r.content,
                        });
                    });

                    // 重置流式输出，准备下一轮
                    finishStreaming();
                    fullContent = '';
                    hasContent = false;
                }

                if (!hasContent) {
                    addMessage('system', '没有收到回复内容');
                }

                finishStreaming();
                setStatus('就绪', 'idle');

            } catch (err) {
                if (err.name === 'AbortError') {
                    addMessage('system', '⏹️ 已取消请求');
                } else if (err === 'insufficient_quota') {
                    addMessage('error', '❌ 配额不足，请检查账户余额');
                    setStatus('配额不足', 'error');
                } else {
                    addMessage('error', `❌ ${err.message || '请求失败'}`);
                    setStatus('错误', 'error');
                    console.error(err);
                }
                finishStreaming();
            } finally {
                isProcessing = false;
                dom.sendBtn.disabled = false;
                dom.sendBtn.innerHTML = '<span class="icon">➤</span> 发送';
                abortController = null;
                dom.input.focus();
            }
        }

        // ========== 事件绑定 ==========
        // 发送按钮
        dom.sendBtn.addEventListener('click', sendMessage);

        // 输入框 - Enter 发送，Shift+Enter 换行
        dom.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 输入框 - 自动高度 + 字数统计
        dom.input.addEventListener('input', () => {
            dom.input.style.height = 'auto';
            dom.input.style.height = Math.min(dom.input.scrollHeight, 120) + 'px';
            dom.charCount.textContent = dom.input.value.length;
        });

        // 模型切换
        dom.modelSelect.addEventListener('change', (e) => {
            switchModel(e.target.value);
            // 保存到 localStorage
            try {
                localStorage.setItem('chat-model', e.target.value);
            } catch {}
        });

        // 重置对话
        dom.btnReset.addEventListener('click', () => {
            if (chat) {
                chat.reset();
                addMessage('system', '🔄 对话历史已重置');
                setStatus('已重置', 'idle');
            }
        });

        // 清屏
        dom.btnClear.addEventListener('click', () => {
            clearMessages();
            addMessage('system', '🗑️ 屏幕已清空');
        });

        // 刷新模型列表
        dom.btnModels.addEventListener('click', loadModels);

        // Ctrl+Enter 快捷键发送（备用）
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ========== 知识库面板 ==========
        function toggleKbPanel() {
            dom.kbPanel.classList.toggle('open');
            if (dom.kbPanel.classList.contains('open')) {
                loadKB();
                dom.kbUrlInput.focus();
            }
        }

        async function loadKB() {
            try {
                const resp = await fetch('/api/kb');
                const data = await resp.json();
                dom.kbStatus.textContent = `(${data.count} 条)`;
                renderKBList(data.items || []);
            } catch (e) {
                dom.kbStatus.textContent = '(加载失败)';
            }
        }

        function renderKBList(items) {
            dom.kbList.innerHTML = '';
            if (items.length === 0) {
                dom.kbList.innerHTML = '<div class="kb-empty">暂无抓取内容，输入网址后点击「抓取」</div>';
                return;
            }
            items.slice().reverse().forEach((item) => {
                const div = document.createElement('div');
                div.className = 'kb-item';

                const head = document.createElement('div');
                head.className = 'kb-item-head';

                const titleWrap = document.createElement('div');
                titleWrap.style.flex = '1';
                const title = document.createElement('div');
                title.className = 'kb-title';
                title.textContent = item.title || item.url;
                const url = document.createElement('div');
                url.className = 'kb-url';
                url.textContent = item.url;
                titleWrap.appendChild(title);
                titleWrap.appendChild(url);

                const del = document.createElement('button');
                del.className = 'kb-del';
                del.textContent = '删除';
                del.addEventListener('click', () => deleteKB(item.id));

                head.appendChild(titleWrap);
                head.appendChild(del);

                const summary = document.createElement('div');
                summary.className = 'kb-summary';
                summary.textContent = item.summary || '';

                div.appendChild(head);
                div.appendChild(summary);
                dom.kbList.appendChild(div);
            });
        }

        async function deleteKB(id) {
            try {
                await fetch('/api/kb/' + encodeURIComponent(id), { method: 'DELETE' });
                loadKB();
            } catch (e) {
                console.error('删除失败', e);
            }
        }

        async function fetchUrl() {
            const url = dom.kbUrlInput.value.trim();
            if (!url || isProcessing) return;

            dom.kbFetchBtn.disabled = true;
            dom.kbFetchBtn.textContent = '抓取中...';
            dom.kbStatus.textContent = '(抓取中...)';

            try {
                const resp = await fetch('/api/fetch-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                const data = await resp.json();

                if (!resp.ok) {
                    addMessage('error', `❌ 抓取失败: ${data.error || resp.status}`);
                } else {
                    addMessage('system', `📚 已抓取: ${data.title}\n${data.url}\n\n摘要:\n${data.summary}`);
                    dom.kbUrlInput.value = '';
                    dom.kbStatus.textContent = `(${(await (await fetch('/api/kb')).json()).count} 条)`;
                }
                loadKB();
            } catch (e) {
                addMessage('error', `❌ 抓取出错: ${e.message}`);
            } finally {
                dom.kbFetchBtn.disabled = false;
                dom.kbFetchBtn.textContent = '抓取';
            }
        }

        // 知识库按钮
        dom.btnKb.addEventListener('click', toggleKbPanel);
        dom.kbFetchBtn.addEventListener('click', fetchUrl);
        dom.kbUrlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                fetchUrl();
            }
        });

        // ========== 初始化 ==========
        async function init() {
            // 检查配置
            // 恢复上次使用的模型
            try {
                const saved = localStorage.getItem('chat-model');
                if (saved) currentModel = saved;
            } catch {}

            // 初始化 chat
            chat = new Chat({
                url: CHAT_URL,
                modelsUrl: MODELS_URL,
                model: currentModel,
                maxHistory: CONFIG.maxHistory,
                system: CONFIG.systemPrompt,
                tools: CHAT_TOOLS,
            });

            // 加载模型列表
            await loadModels();
            dom.modelSelect.value = currentModel;

            // 预加载知识库计数
            loadKB().catch(() => {});

            // 显示欢迎
            addMessage('system', `🤖 欢迎！当前模型: ${currentModel}`);
            addMessage('system', `💡 输入消息开始对话，/help 查看命令`);

            dom.input.focus();
        }

        // 简单的命令支持
        const origSend = sendMessage;
        sendMessage = async function() {
            const text = dom.input.value.trim();
            if (text.startsWith('/')) {
                const parts = text.split(/\s+/);
                const cmd = parts[0].toLowerCase();
                const arg = parts.slice(1).join(' ');
                dom.input.value = '';
                dom.charCount.textContent = '0';

                switch (cmd) {
                    case '/help':
                        addMessage('system', `命令: /models 刷新模型 /use 模型名 /reset 重置 /clear 清屏 /help 帮助`);
                        break;
                    case '/models':
                        await loadModels();
                        break;
                    case '/use':
                        if (arg) {
                            const exists = availableModels.some(m => m.id === arg);
                            if (exists || availableModels.length === 0) {
                                switchModel(arg);
                                addMessage('system', `✅ 切换到: ${arg}`);
                            } else {
                                addMessage('system', `❌ 模型 "${arg}" 不可用`);
                            }
                        } else {
                            addMessage('system', `用法: /use 模型名`);
                        }
                        break;
                    case '/reset':
                        if (chat) { chat.reset();
                            addMessage('system', '🔄 已重置'); }
                        break;
                    case '/clear':
                        clearMessages();
                        addMessage('system', '🗑️ 已清屏');
                        break;
                    default:
                        addMessage('system', `未知命令: ${cmd}，输入 /help 查看`);
                }
                dom.input.focus();
                return;
            }
            await origSend.call(this);
        };

        // 启动
        init().catch(console.error);
    </script>

</body>
</html>
