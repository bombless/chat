<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="app">
        <!-- ====== 顶栏 ====== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🤖 Chat</span>
                <div class="model-selector">
                    <label>模型</label>
                    <select id="modelSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
                <span class="status">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">就绪</span>
                </span>
            </div>
            <div class="header-actions">
                <button class="btn btn-warning" id="btnKb" title="打开知识库面板">📚 <span>知识库</span></button>
                <button class="btn btn-warning" id="btnConfigExport" title="导出 Provider 配置">📤 <span>导出配置</span></button>
                <button class="btn btn-warning" id="btnModels" title="刷新模型列表">📋 <span>模型</span></button>
                <button class="btn btn-danger" id="btnReset">🔄 <span>重置</span></button>
                <button class="btn btn-success" id="btnClear">🗑️ <span>清屏</span></button>
            </div>
        </header>

        <!-- ====== 知识库面板 ====== -->
        <div class="kb-panel" id="kbPanel">
            <h4>📚 网页知识库 <span class="kb-status" id="kbStatus"></span></h4>
            <div class="kb-input-row">
                <input type="text" id="kbUrlInput" placeholder="输入任意网址，例如 https://example.com，回车抓取" />
                <button class="kb-fetch-btn" id="kbFetchBtn">抓取</button>
            </div>
            <div class="kb-list" id="kbList"></div>
        </div>

        <div class="transfer-modal" id="transferModal">
            <div class="transfer-card">
                <h3>📤 导出配置</h3>
                <div id="transferCreating">正在生成连接……</div>
                <div id="transferWaiting" style="display:none">
                    <img class="transfer-qr" id="transferQr" alt="配置迁移二维码" />
                    <div class="transfer-muted">请使用 Android App 扫描此二维码<br/>确保手机和电脑连接到同一个局域网</div>
                    <div id="transferWaitText">等待 Android 连接……</div>
                    <div class="transfer-muted">有效期：<span id="transferExpiry">05:00</span></div>
                </div>
                <div id="transferConnected" style="display:none">
                    <div>Android 已连接</div>
                    <div class="transfer-muted">请确认两端显示的验证码，然后在电脑端输入</div>
                    <input class="transfer-code-input" id="transferCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="______" />
                    <div class="transfer-error" id="transferError"></div>
                    <div class="transfer-actions"><button class="btn btn-success" id="transferConfirm">确认导出</button><button class="btn" id="transferCancel">取消</button></div>
                </div>
                <div id="transferCompleted" style="display:none"><div style="font-size:38px">✅</div><div>配置导出成功</div><div class="transfer-muted">Android 已成功获取配置。</div><button class="btn" id="transferDone">完成</button></div>
            </div>
        </div>        <!-- ====== 消息区域 ====== -->
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="icon">💬</div>
                <h3>开始对话吧</h3>
                <p style="color:#4a5a6a;font-size:13px;margin-top:4px;">支持多轮对话，自动记忆上下文</p>
            </div>
        </div>

        <!-- ====== 输入区域 ====== -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="inputBox" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" maxlength="4000"></textarea>
                <div class="char-count"><span id="charCount">0</span> / 4000</div>
            </div>
            <button class="send-btn" id="sendBtn">
                <span class="icon">➤</span> 发送
            </button>
        </div>
    </div>

    <!-- ====== 配置 ====== -->
    <script src="script.js"></script>
    <script src="tools-ui.js"></script>
    <script src="workdir-ui.js"></script>
</body>
</html>
